# Stopped at checkpoint 2, the scheduler: no node has 1000 CPUs to offer.
apiVersion: v1
kind: Pod
metadata:
  name: too-big
  annotations:
    what: "Just sleeps. Requests 1000 CPUs, more than any node has."
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: lab-tools:1.0
      args: ["sleep", "infinity"]
      resources:
        requests: {cpu: "1000", memory: 64Mi}
