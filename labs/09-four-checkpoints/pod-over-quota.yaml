# Stopped at checkpoint 1, the API server: it would go over the namespace's quota.
apiVersion: v1
kind: Pod
metadata:
  name: over-quota
  namespace: lab-checkpoints
  annotations:
    what: "Just sleeps. Requests 250m CPU in a namespace whose quota allows 100m."
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: lab-tools:1.0
      args: ["sleep", "infinity"]
      resources:
        requests: {cpu: 250m, memory: 64Mi}
        limits:   {cpu: 500m, memory: 128Mi}
