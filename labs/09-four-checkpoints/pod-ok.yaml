# Passes every checkpoint and ends up as numbers in cgroup files (checkpoints 3 and 4).
apiVersion: v1
kind: Pod
metadata:
  name: pod-ok
  annotations:
    what: "Just sleeps. The blog's numbers: 250m/64Mi requested, 500m/128Mi limit."
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: lab-tools:1.0
      args: ["sleep", "infinity"]
      resources:
        requests: {cpu: 250m, memory: 64Mi}
        limits:   {cpu: 500m, memory: 128Mi}
