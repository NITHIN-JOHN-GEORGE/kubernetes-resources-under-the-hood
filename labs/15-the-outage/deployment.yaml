# The blog's outage, scaled down to a laptop.
# 3 replicas of a small web service. Each request burns 50 ms of CPU in each of 4 workers
# (200 ms of CPU, fanned out in parallel), and there are 4 request threads, so /healthz
# waits for a free thread like any other request. CPU limit: 500m.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serve
spec:
  replicas: 3
  selector:
    matchLabels: {app: serve}
  template:
    metadata:
      labels: {app: serve}
      annotations:
        what: "A web service: 4 request threads, 200 ms of CPU per request fanned out to 4 workers, 500m CPU limit."
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: lab-tools:1.0
          args: ["serve", "--work-ms", "50", "--workers", "4", "--threads", "4"]
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 250m, memory: 64Mi}
            limits:   {cpu: 500m, memory: 128Mi}
          # Probes every 3 s while bursts come every 2 s, so probes land at every point of the
          # burst cycle (with a 2 s period they'd always hit the same quiet moment).
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2   # restart after 2 timeouts in a row
