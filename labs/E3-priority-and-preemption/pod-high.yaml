# High-priority pod asking for the same CPU. It only fits if prio-low goes.
apiVersion: v1
kind: Pod
metadata:
  name: prio-high
  annotations:
    what: "Just sleeps, requesting the same CPU. High priority, so it can push prio-low out."
spec:
  priorityClassName: lab-high
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: lab-tools:1.0
      args: ["sleep", "infinity"]
      resources:
        requests: {cpu: __CPU__, memory: 16Mi}
