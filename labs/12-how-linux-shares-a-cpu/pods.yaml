# Two identical greedy pods with equal requests and no CPU limit.
# Together they want twice the node's CPUs, so the kernel has to share.
apiVersion: v1
kind: Pod
metadata:
  name: share-a
  annotations:
    what: "One busy loop per node CPU. Requests 250m, no CPU limit."
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: lab-tools:1.0
      args: ["burn", "--threads", "all"]
      resources:
        requests: {cpu: 250m, memory: 16Mi}
        limits:   {memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: share-b
  annotations:
    what: "One busy loop per node CPU. Requests 250m, no CPU limit."
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: lab-tools:1.0
      args: ["burn", "--threads", "all"]
      resources:
        requests: {cpu: 250m, memory: 16Mi}
        limits:   {memory: 64Mi}
