# Three idle batch pods that reserve memory (__MEM__ each, filled in by start.sh) but use almost none,
# and the new pod someone is trying to deploy.
apiVersion: v1
kind: Pod
metadata:
  name: batch-1
  labels: {incident: "3"}
  annotations:
    what: "An idle nightly batch job. It only runs at night, so right now it just sleeps."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 50m, memory: __MEM__}
---
apiVersion: v1
kind: Pod
metadata:
  name: batch-2
  labels: {incident: "3"}
  annotations:
    what: "Another idle nightly batch job, also just sleeping."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 50m, memory: __MEM__}
---
apiVersion: v1
kind: Pod
metadata:
  name: batch-3
  labels: {incident: "3"}
  annotations:
    what: "A third idle nightly batch job, also just sleeping."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 50m, memory: __MEM__}
---
apiVersion: v1
kind: Pod
metadata:
  name: new-feature
  labels: {incident: "3"}
  annotations:
    what: "The new service the team wants to ship. Needs 1 GiB of memory."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 50m, memory: 1Gi}
        limits:   {memory: 1Gi}
