apiVersion: v1
kind: Pod
metadata:
  name: report-worker
  labels: {incident: "2"}
  annotations:
    what: "A pretend report worker. It keeps a 100 MiB cache in memory and builds a report every 20 seconds."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: python:3.12-alpine
      command: ["python", "-u", "-c"]
      args:
        - |
          import time
          cache = b"c" * (100 * 1024 * 1024)        # 100 MiB kept for the whole run
          print("cache loaded (100 MiB)", flush=True)
          n = 0
          while True:
              time.sleep(20)
              n += 1
              print(f"building report {n}...", flush=True)
              report = b"r" * (200 * 1024 * 1024)   # 200 MiB, but only for a moment
              del report
              print(f"report {n} done", flush=True)
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits:   {cpu: 500m, memory: 256Mi}
