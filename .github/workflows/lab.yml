name: Run the lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly, to catch breakage from new kind or Kubernetes releases

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning lib/*.sh scripts/*.sh labs/*/check.sh incidents/*/*.sh

  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [default, pressure, pids]
    steps:
      - uses: actions/checkout@v4
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Create the cluster (${{ matrix.profile }})
        run: make cluster PROFILE=${{ matrix.profile }}
      - name: Run every lab for this profile
        run: make test
      - name: Upload expected.txt files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expected-${{ matrix.profile }}
          path: labs/*/expected.txt
      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n lab describe pods || true
