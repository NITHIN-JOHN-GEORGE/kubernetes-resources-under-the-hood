name: Run the lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly, to catch breakage from new kind or Kubernetes releases

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning lib/*.sh scripts/*.sh modules/*/run.sh

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: kind-config.yaml
          cluster_name: under-the-hood

      - name: Run every module
        run: make check-all

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n lab describe pods || true
