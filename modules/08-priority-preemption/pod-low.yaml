# Low-priority pod. __CPU__ is filled in by run.sh so it takes nearly all free CPU on the worker.
apiVersion: v1
kind: Pod
metadata:
  name: prio-low
  labels: {module: "08"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  priorityClassName: lab-low
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: __CPU__, memory: 16Mi}
