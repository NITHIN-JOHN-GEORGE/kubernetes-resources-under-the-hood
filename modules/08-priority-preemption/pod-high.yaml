# High-priority pod asking for the same CPU. It only fits if prio-low goes.
apiVersion: v1
kind: Pod
metadata:
  name: prio-high
  labels: {module: "08"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  priorityClassName: lab-high
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: __CPU__, memory: 16Mi}
