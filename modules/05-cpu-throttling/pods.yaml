# Both pods run 4 busy loops. Only one of them has a CPU limit.
apiVersion: v1
kind: Pod
metadata:
  name: cpu-limited
  labels: {module: "05"}
  annotations:
    what: "4 busy loops that each want a whole CPU, squeezed into a 200m limit."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "for i in 1 2 3 4; do (while :; do :; done) & done; wait"]
      resources:
        requests: {cpu: 100m, memory: 16Mi}
        limits:   {cpu: 200m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-unlimited
  labels: {module: "05"}
  annotations:
    what: "The same 4 busy loops, with no CPU limit."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "for i in 1 2 3 4; do (while :; do :; done) & done; wait"]
      resources:
        requests: {cpu: 100m, memory: 16Mi}
        limits:   {memory: 32Mi}
