# Fits inside the quota.
apiVersion: v1
kind: Pod
metadata:
  name: q-small
  namespace: lab-quota
  labels: {module: "14"}
  annotations:
    what: "Just sleeps. Requests 200m CPU, which fits the 500m quota."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 200m, memory: 100Mi}
        limits:   {memory: 128Mi}
