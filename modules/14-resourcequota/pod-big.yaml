# Would push requests.cpu to 600m, over the 500m quota.
apiVersion: v1
kind: Pod
metadata:
  name: q-big
  namespace: lab-quota
  labels: {module: "14"}
  annotations:
    what: "Just sleeps. Requests 400m CPU, which would push the namespace over its quota."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 400m, memory: 100Mi}
        limits:   {memory: 128Mi}
