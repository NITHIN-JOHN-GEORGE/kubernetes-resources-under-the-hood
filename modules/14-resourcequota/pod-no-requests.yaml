# No resources at all. A quota on requests makes them mandatory, so this is rejected.
apiVersion: v1
kind: Pod
metadata:
  name: q-no-requests
  namespace: lab-quota
  labels: {module: "14"}
  annotations:
    what: "Just sleeps. Has no requests, so the namespace quota should reject it."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
