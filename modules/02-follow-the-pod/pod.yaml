# The same resources as the YAML at the top of the blog post.
apiVersion: v1
kind: Pod
metadata:
  name: follow-me
  labels: {module: "02"}
  annotations:
    what: "Just sleeps. We only look at the cgroup it lives in, layer by layer."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 250m, memory: 64Mi}
        limits:   {cpu: 500m, memory: 128Mi}
