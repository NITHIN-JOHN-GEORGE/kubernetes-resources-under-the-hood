# No resources section. The LimitRange fills one in.
apiVersion: v1
kind: Pod
metadata:
  name: lr-defaults
  namespace: lab-limits
  labels: {module: "15"}
  annotations:
    what: "Just sleeps. Has no resources: section, so the LimitRange fills one in."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
