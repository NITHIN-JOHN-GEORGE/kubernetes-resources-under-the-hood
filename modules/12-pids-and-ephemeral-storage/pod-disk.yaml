# Writes 100 MiB into an emptyDir while its ephemeral-storage limit is 50Mi.
apiVersion: v1
kind: Pod
metadata:
  name: disk-hog
  labels: {module: "12"}
  annotations:
    what: "Writes 100 MiB into an emptyDir with a 50Mi ephemeral-storage limit."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "sleep 5; dd if=/dev/zero of=/data/fill bs=1M count=100; echo wrote 100MiB; sleep 3600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi, ephemeral-storage: 10Mi}
        limits:   {memory: 64Mi, ephemeral-storage: 50Mi}
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      emptyDir: {}
