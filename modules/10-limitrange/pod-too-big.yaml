# Memory limit above the LimitRange max of 256Mi.
apiVersion: v1
kind: Pod
metadata:
  name: lr-too-big
  namespace: lab-limits
  labels: {module: "10"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits:   {cpu: 200m, memory: 512Mi}
