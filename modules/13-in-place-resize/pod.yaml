# Guaranteed pod that will be resized while it runs. Requests equal limits so the QoS class
# (which can't change during a resize) stays Guaranteed.
apiVersion: v1
kind: Pod
metadata:
  name: resize-demo
  labels: {module: "13"}
  annotations:
    what: "Just sleeps. We change its CPU and memory while it runs."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resizePolicy:
        - {resourceName: cpu, restartPolicy: NotRequired}
        - {resourceName: memory, restartPolicy: NotRequired}
      resources:
        requests: {cpu: 200m, memory: 64Mi}
        limits:   {cpu: 200m, memory: 64Mi}
