# A quiet pod with a 128Mi memory limit. We'll fill it two different ways with kubectl exec.
apiVersion: v1
kind: Pod
metadata:
  name: mem-lab
  labels: {module: "07"}
  annotations:
    what: "Just sleeps. We fill its memory from outside with kubectl exec: first file cache, then anonymous memory."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits:   {cpu: 500m, memory: 128Mi}
