# Asks for more memory than the worker can ever offer to pods.
# __MEM__ is replaced with (allocatable + 1Gi) by run.sh.
apiVersion: v1
kind: Pod
metadata:
  name: too-big
  labels: {module: "09"}
  annotations:
    what: "Just sleeps, if it ever starts. It requests 1 GiB more memory than the node can offer."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: __MEM__}
