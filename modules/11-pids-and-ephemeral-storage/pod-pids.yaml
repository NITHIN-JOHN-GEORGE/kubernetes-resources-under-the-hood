# Tries to start 100 background processes as soon as it starts.
# The spawner runs in a subshell: when fork() is refused, only the subshell dies,
# and the main shell carries on with `exec sleep` (which needs no new process).
apiVersion: v1
kind: Pod
metadata:
  name: pid-hog
  labels: {module: "11"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  terminationGracePeriodSeconds: 1
  containers:
    - name: main
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          ( i=0
            while [ $i -lt 100 ]; do
              sleep 3600 &
              i=$((i+1))
              echo "started $i"
            done
            echo "started all 100" )
          echo "spawner finished"
          exec sleep 3600
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits:   {memory: 64Mi}
