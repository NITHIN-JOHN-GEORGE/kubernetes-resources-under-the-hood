# Allocates memory 10 MiB at a time, well past its 64Mi limit.
apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
  labels: {module: "06"}
  annotations:
    what: "Python script that grabs 10 MiB every 0.3 s and never frees it, against a 64Mi limit."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  restartPolicy: Always
  containers:
    - name: main
      image: python:3.12-alpine
      command: ["python", "-u", "-c"]
      args:
        - |
          import time
          chunks = []
          for i in range(1, 31):
              chunks.append(b"x" * 10 * 1024 * 1024)   # touch every byte so it really counts
              print(f"allocated {i * 10} MiB", flush=True)
              time.sleep(0.3)
          time.sleep(3600)
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits:   {cpu: 500m, memory: 64Mi}
