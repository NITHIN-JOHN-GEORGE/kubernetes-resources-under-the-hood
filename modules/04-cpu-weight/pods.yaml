# Two pods with no CPU limit compete for the same CPUs.
# __THREADS__ is replaced with the node's CPU count so the node is fully contended.
apiVersion: v1
kind: Pod
metadata:
  name: weight-low
  labels: {module: "04"}
  annotations:
    what: "One busy loop per node CPU, all wanting CPU at once. Requests 100m, no CPU limit."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while [ $i -lt __THREADS__ ]; do (while :; do :; done) & i=$((i+1)); done; wait"]
      resources:
        requests: {cpu: 100m, memory: 16Mi}
        limits:   {memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: weight-high
  labels: {module: "04"}
  annotations:
    what: "One busy loop per node CPU, all wanting CPU at once. Requests 800m, no CPU limit."
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while [ $i -lt __THREADS__ ]; do (while :; do :; done) & i=$((i+1)); done; wait"]
      resources:
        requests: {cpu: 800m, memory: 16Mi}
        limits:   {memory: 64Mi}
