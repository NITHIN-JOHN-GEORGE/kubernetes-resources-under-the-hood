# Three pods on the worker. Only memory-hog uses a lot of memory, and it has no requests.
apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
  labels: {module: "07"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  restartPolicy: Never
  containers:
    - name: main
      image: python:3.12-alpine
      command: ["python", "-u", "-c"]
      args:
        - |
          import time
          chunks = []
          for i in range(1, 101):
              chunks.append(b"x" * 10 * 1024 * 1024)
              if i % 10 == 0:
                  print(f"allocated {i * 10} MiB", flush=True)
              time.sleep(0.2)
          time.sleep(3600)
---
apiVersion: v1
kind: Pod
metadata:
  name: calm-burstable
  labels: {module: "07"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  restartPolicy: Never
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: calm-guaranteed
  labels: {module: "07"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  restartPolicy: Never
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits:   {cpu: 10m, memory: 32Mi}
