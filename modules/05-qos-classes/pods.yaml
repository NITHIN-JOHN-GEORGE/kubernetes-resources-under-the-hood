# One pod per QoS class. The class is derived only from requests and limits.
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  labels: {module: "05"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:            # requests == limits for CPU and memory
        requests: {cpu: 100m, memory: 64Mi}
        limits:   {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
  labels: {module: "05"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:            # some requests/limits, but not equal
        requests: {cpu: 50m, memory: 32Mi}
        limits:   {memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
  labels: {module: "05"}
spec:
  nodeSelector: {kubernetes.io/hostname: under-the-hood-worker}
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]   # no resources at all
